[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-governance-block"
version = "0.1.0"
description = "Vendor-neutral skill-manifest binding of the Loomground governance language, plus its canonical reference compiler (reference/) and conformance tests."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "flxk1", email = "flxk1@users.noreply.github.com" }]
dependencies = [
  "pyyaml>=6",
]

[tool.setuptools.packages.find]
include = ["reference*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
